<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B2149" />
    <meta name="description" content="Nour de Commerce — ERP commercial (stocks, ventes, caisse, factures)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nour ERP" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Nour de Commerce — ERP</title>
    <script>
      try {
        if (localStorage.getItem('ndc-theme') === 'dark') document.documentElement.classList.add('dark');
        if (localStorage.getItem('ndc-lang') === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
        <img src="/logo-sm.png" alt="Nour de Commerce" style="width:260px;max-width:70vw" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
